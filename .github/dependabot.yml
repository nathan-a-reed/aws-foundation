version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      aws-cdk:
        patterns:
          - aws-cdk
          - aws-cdk-lib
          - constructs
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
